<svg width="900" height="1080" viewBox="0 0 900 1080" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif">
  <title>Sistema de transporte sostenible - Infografía</title>
  <desc>Infografía educativa que compara modos de transporte según su impacto ambiental en emisiones de CO2, eficiencia energética y uso de espacio urbano.</desc>

  <!-- Background -->
  <rect width="900" height="1080" fill="#F4F9F1" rx="0"/>

  <!-- Header band -->
  <rect x="0" y="0" width="900" height="110" fill="#1D9E75"/>
  <rect x="0" y="105" width="900" height="8" fill="#0F6E56"/>

  <!-- Header text -->
  <text x="450" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF" letter-spacing="1">Sistema de transporte sostenible</text>
  <text x="450" y="80" text-anchor="middle" font-size="16" font-weight="400" fill="#9FE1CB">Impacto ambiental de cada modo de transporte · Ingeniería Ambiental</text>

  <!-- Subtitle band -->
  <rect x="0" y="113" width="900" height="36" fill="#E1F5EE"/>
  <text x="450" y="136" text-anchor="middle" font-size="13" fill="#085041" font-weight="500">g CO₂ / pasajero·km  ·  Eficiencia energética  ·  Espacio urbano  ·  Costo ambiental</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ROW 1: Bicicleta + a pie -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="30" y="165" width="840" height="130" rx="14" fill="#EAF3DE" stroke="#97C459" stroke-width="1.5"/>
  <!-- Icon area -->
  <rect x="50" y="180" width="90" height="100" rx="10" fill="#3B6D11"/>
  <!-- Bike icon (simplified) -->
  <circle cx="75" cy="250" r="18" fill="none" stroke="#9FE1CB" stroke-width="3"/>
  <circle cx="110" cy="250" r="18" fill="none" stroke="#9FE1CB" stroke-width="3"/>
  <line x1="75" y1="250" x2="92" y2="232" stroke="#9FE1CB" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="92" y1="232" x2="110" y2="250" stroke="#9FE1CB" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="92" y1="232" x2="92" y2="222" stroke="#9FE1CB" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="88" y="218" width="12" height="5" rx="2" fill="#9FE1CB"/>
  <!-- Person walking -->
  <circle cx="68" cy="200" r="7" fill="#9FE1CB"/>
  <line x1="68" y1="207" x2="68" y2="222" stroke="#9FE1CB" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="213" x2="62" y2="218" stroke="#9FE1CB" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="213" x2="74" y2="218" stroke="#9FE1CB" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="222" x2="63" y2="230" stroke="#9FE1CB" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="222" x2="73" y2="230" stroke="#9FE1CB" stroke-width="2" stroke-linecap="round"/>

  <text x="160" y="195" font-size="20" font-weight="700" fill="#27500A">Bicicleta y desplazamiento a pie</text>
  <text x="160" y="215" font-size="13" fill="#3B6D11">Modo de transporte activo · sin motor · energía humana</text>

  <!-- CO2 bar -->
  <text x="160" y="240" font-size="12" fill="#444441">CO₂ emitido</text>
  <rect x="240" y="228" width="200" height="14" rx="7" fill="#D3D1C7"/>
  <rect x="240" y="228" width="4" height="14" rx="7" fill="#27500A"/>
  <text x="448" y="240" font-size="12" font-weight="700" fill="#27500A">0 g/pas·km</text>

  <!-- Energy bar -->
  <text x="160" y="263" font-size="12" fill="#444441">Eficiencia energética</text>
  <rect x="270" y="251" width="200" height="14" rx="7" fill="#D3D1C7"/>
  <rect x="270" y="251" width="196" height="14" rx="7" fill="#3B6D11"/>
  <text x="474" y="263" font-size="12" font-weight="700" fill="#3B6D11">100%</text>

  <!-- Space bar -->
  <text x="160" y="286" font-size="12" fill="#444441">Espacio vial</text>
  <rect x="240" y="274" width="200" height="14" rx="7" fill="#D3D1C7"/>
  <rect x="240" y="274" width="10" height="14" rx="7" fill="#97C459"/>
  <text x="448" y="286" font-size="12" font-weight="700" fill="#639922">Mínimo</text>

  <!-- Badge -->
  <rect x="710" y="185" width="140" height="90" rx="10" fill="#27500A"/>
  <text x="780" y="215" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">0</text>
  <text x="780" y="235" text-anchor="middle" font-size="11" fill="#9FE1CB">g CO₂/pas·km</text>
  <text x="780" y="258" text-anchor="middle" font-size="11" fill="#C0DD97">⭐ Ideal climático</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ROW 2: Metro / Tren -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="30" y="312" width="840" height="130" rx="14" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
  <rect x="50" y="327" width="90" height="100" rx="10" fill="#534AB7"/>
  <!-- Metro icon -->
  <rect x="58" y="350" width="74" height="42" rx="6" fill="#AFA9EC"/>
  <rect x="62" y="356" width="14" height="12" rx="2" fill="#EEEDFE"/>
  <rect x="80" y="356" width="14" height="12" rx="2" fill="#EEEDFE"/>
  <rect x="98" y="356" width="14" height="12" rx="2" fill="#EEEDFE"/>
  <circle cx="68" cy="398" r="5" fill="#3C3489"/>
  <circle cx="114" cy="398" r="5" fill="#3C3489"/>
  <text x="88" y="348" text-anchor="middle" font-size="10" fill="#EEEDFE" font-weight="600">METRO</text>
  <!-- Rail line -->
  <line x1="50" y1="403" x2="140" y2="403" stroke="#AFA9EC" stroke-width="3" stroke-linecap="round"/>

  <text x="160" y="342" font-size="20" font-weight="700" fill="#26215C">Metro y tren eléctrico</text>
  <text x="160" y="362" font-size="13" fill="#534AB7">Transporte masivo · tracción eléctrica · alta capacidad</text>

  <text x="160" y="387" font-size="12" fill="#444441">CO₂ emitido</text>
  <rect x="240" y="375" width="200" height="14" rx="7" fill="#D3D1C7"/>
  <rect x="240" y="375" width="10" height="14" rx="7" fill="#534AB7"/>
  <text x="448" y="387" font-size="12" font-weight="700" fill="#534AB7">8 g/pas·km</text>

  <text x="160" y="410" font-size="12" fill="#444441">Eficiencia energética</text>
  <rect x="270" y="398" width="200" height="14" rx="7" fill="#D3D1C7"/>
  <rect x="270" y="398" width="178" height="14" rx="7" fill="#7F77DD"/>
  <text x="474" y="410" font-size="12" font-weight="700" fill="#534AB7">91%</text>

  <text x="160" y="433" font-size="12" fill="#444441">Espacio vial</text>
  <rect x="240" y="421" width="200" height="14" rx="7" fill="#D3D1C7"/>
  <rect x="240" y="421" width="20" height="14" rx="7" fill="#AFA9EC"/>
  <text x="448" y="433" font-size="12" font-weight="700" fill="#534AB7">Muy bajo</text>

  <rect x="710" y="332" width="140" height="90" rx="10" fill="#3C3489"/>
  <text x="780" y="362" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">8</text>
  <text x="780" y="382" text-anchor="middle" font-size="11" fill="#CECBF6">g CO₂/pas·km</text>
  <text x="780" y="405" text-anchor="middle" font-size="11" fill="#AFA9EC">Excelente opción</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ROW 3: Bus eléctrico -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="30" y="459" width="840" height="130" rx="14" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
  <rect x="50" y="474" width="90" height="100" rx="10" fill="#185FA5"/>
  <!-- Bus icon -->
  <rect x="58" y="495" width="74" height="50" rx="6" fill="#85B7EB"/>
  <rect x="62" y="502" width="12" height="10" rx="2" fill="#E6F1FB"/>
  <rect x="78" y="502" width="12" height="10" rx="2" fill="#E6F1FB"/>
  <rect x="94" y="502" width="12" height="10" rx="2" fill="#E6F1FB"/>
  <rect x="110" y="502" width="12" height="10" rx="2" fill="#E6F1FB"/>
  <circle cx="70" cy="550" r="6" fill="#0C447C"/>
  <circle cx="120" cy="550" r="6" fill="#0C447C"/>
  <text x="92" y="493" text-anchor="middle" font-size="10" fill="#E6F1FB" font-weight="600">BUS E.</text>
  <!-- Lightning bolt (electric) -->
  <polygon points="102,474 96,488 102,488 96,502" fill="#FAC775" opacity="0.9"/>

  <text x="160" y="489" font-size="20" font-weight="700" fill="#042C53">Bus eléctrico urbano</text>
  <text x="160" y="509" font-size="13" fill="#185FA5">Transporte colectivo · electricidad renovable · 80+ pasajeros</text>

  <text x="160" y="534" font-size="12" fill="#444441">CO₂ emitido</text>
  <rect x="240" y="522" width="200" height="14" rx="7" fill="#D3D1C7"/>
  <rect x="240" y="522" width="22" height="14" rx="7" fill="#185FA5"/>
  <text x="448" y="534" font-size="12" font-weight="700" fill="#185FA5">18 g/pas·km</text>

  <text x="160" y="557" font-size="12" fill="#444441">Eficiencia energética</text>
  <rect x="270" y="545" width="200" height="14" rx="7" fill="#D3D1C7"/>
  <rect x="270" y="545" width="160" height="14" rx="7" fill="#378ADD"/>
  <text x="474" y="557" font-size="12" font-weight="700" fill="#185FA5">82%</text>

  <text x="160" y="580" font-size="12" fill="#444441">Espacio vial</text>
  <rect x="240" y="568" width="200" height="14" rx="7" fill="#D3D1C7"/>
  <rect x="240" y="568" width="40" height="14" rx="7" fill="#85B7EB"/>
  <text x="448" y="580" font-size="12" font-weight="700" fill="#185FA5">Bajo</text>

  <rect x="710" y="479" width="140" height="90" rx="10" fill="#0C447C"/>
  <text x="780" y="509" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">18</text>
  <text x="780" y="529" text-anchor="middle" font-size="11" fill="#B5D4F4">g CO₂/pas·km</text>
  <text x="780" y="552" text-anchor="middle" font-size="11" fill="#85B7EB">Buena alternativa</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ROW 4: Auto eléctrico -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="30" y="606" width="840" height="130" rx="14" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.5"/>
  <rect x="50" y="621" width="90" height="100" rx="10" fill="#854F0B"/>
  <!-- Car icon electric -->
  <rect x="58" y="652" width="74" height="34" rx="8" fill="#EF9F27"/>
  <rect x="66" y="642" width="50" height="20" rx="6" fill="#FAC775"/>
  <circle cx="70" cy="690" r="7" fill="#633806"/>
  <circle cx="122" cy="690" r="7" fill="#633806"/>
  <rect x="62" y="650" width="12" height="8" rx="2" fill="#FAEEDA" opacity="0.8"/>
  <rect x="78" y="650" width="12" height="8" rx="2" fill="#FAEEDA" opacity="0.8"/>
  <!-- Lightning bolt -->
  <polygon points="100,621 94,635 100,635 94,649" fill="#9FE1CB" opacity="0.9"/>

  <text x="160" y="636" font-size="20" font-weight="700" fill="#412402">Auto eléctrico privado</text>
  <text x="160" y="656" font-size="13" fill="#854F0B">Vehículo individual · electricidad · batería de litio</text>

  <text x="160" y="681" font-size="12" fill="#444441">CO₂ emitido</text>
  <rect x="240" y="669" width="200" height="14" rx="7" fill="#D3D1C7"/>
  <rect x="240" y="669" width="48" height="14" rx="7" fill="#BA7517"/>
  <text x="448" y="681" font-size="12" font-weight="700" fill="#854F0B">40 g/pas·km</text>

  <text x="160" y="704" font-size="12" fill="#444441">Eficiencia energética</text>
  <rect x="270" y="692" width="200" height="14" rx="7" fill="#D3D1C7"/>
  <rect x="270" y="692" width="90" height="14" rx="7" fill="#EF9F27"/>
  <text x="474" y="704" font-size="12" font-weight="700" fill="#854F0B">46%</text>

  <text x="160" y="727" font-size="12" fill="#444441">Espacio vial</text>
  <rect x="240" y="715" width="200" height="14" rx="7" fill="#D3D1C7"/>
  <rect x="240" y="715" width="120" height="14" rx="7" fill="#FAC775"/>
  <text x="448" y="727" font-size="12" font-weight="700" fill="#854F0B">Alto</text>

  <rect x="710" y="626" width="140" height="90" rx="10" fill="#633806"/>
  <text x="780" y="656" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">40</text>
  <text x="780" y="676" text-anchor="middle" font-size="11" fill="#FAC775">g CO₂/pas·km</text>
  <text x="780" y="699" text-anchor="middle" font-size="11" fill="#EF9F27">Impacto moderado</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ROW 5: Auto gasolina -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="30" y="753" width="840" height="130" rx="14" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.5"/>
  <rect x="50" y="768" width="90" height="100" rx="10" fill="#A32D2D"/>
  <!-- Car icon gasoline -->
  <rect x="58" y="800" width="74" height="34" rx="8" fill="#E24B4A"/>
  <rect x="66" y="790" width="50" height="20" rx="6" fill="#F09595"/>
  <circle cx="70" cy="838" r="7" fill="#501313"/>
  <circle cx="122" cy="838" r="7" fill="#501313"/>
  <rect x="62" y="798" width="12" height="8" rx="2" fill="#FCEBEB" opacity="0.8"/>
  <rect x="78" y="798" width="12" height="8" rx="2" fill="#FCEBEB" opacity="0.8"/>
  <!-- Smoke puffs -->
  <circle cx="55" cy="810" r="6" fill="#B4B2A9" opacity="0.6"/>
  <circle cx="48" cy="803" r="5" fill="#D3D1C7" opacity="0.5"/>
  <circle cx="42" cy="797" r="4" fill="#F1EFE8" opacity="0.4"/>

  <text x="160" y="783" font-size="20" font-weight="700" fill="#501313">Auto de gasolina (privado)</text>
  <text x="160" y="803" font-size="13" fill="#A32D2D">Vehículo individual · combustión interna · 1–2 ocupantes</text>

  <text x="160" y="828" font-size="12" fill="#444441">CO₂ emitido</text>
  <rect x="240" y="816" width="200" height="14" rx="7" fill="#D3D1C7"/>
  <rect x="240" y="816" width="200" height="14" rx="7" fill="#E24B4A"/>
  <text x="448" y="828" font-size="12" font-weight="700" fill="#A32D2D">170 g/pas·km</text>

  <text x="160" y="851" font-size="12" fill="#444441">Eficiencia energética</text>
  <rect x="270" y="839" width="200" height="14" rx="7" fill="#D3D1C7"/>
  <rect x="270" y="839" width="30" height="14" rx="7" fill="#F09595"/>
  <text x="474" y="851" font-size="12" font-weight="700" fill="#A32D2D">15%</text>

  <text x="160" y="874" font-size="12" fill="#444441">Espacio vial</text>
  <rect x="240" y="862" width="200" height="14" rx="7" fill="#D3D1C7"/>
  <rect x="240" y="862" width="190" height="14" rx="7" fill="#F7C1C1"/>
  <text x="448" y="874" font-size="12" font-weight="700" fill="#A32D2D">Muy alto</text>

  <rect x="710" y="773" width="140" height="90" rx="10" fill="#791F1F"/>
  <text x="780" y="803" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">170</text>
  <text x="780" y="823" text-anchor="middle" font-size="11" fill="#F7C1C1">g CO₂/pas·km</text>
  <text x="780" y="846" text-anchor="middle" font-size="11" fill="#F09595">Alto impacto</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- SCALE LEGEND -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="30" y="902" width="840" height="58" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="50" y="922" font-size="12" fill="#5F5E5A" font-weight="600">Escala de barras CO₂:</text>
  <rect x="50" y="930" width="200" height="12" rx="6" fill="#D3D1C7"/>
  <text x="258" y="941" font-size="11" fill="#888780">0 g</text>
  <text x="50" y="955" font-size="11" fill="#27500A">0 g = neutro climático</text>
  <text x="175" y="955" font-size="11" fill="#854F0B">40 g = moderado</text>
  <text x="310" y="955" font-size="11" fill="#A32D2D">170 g = máximo registrado</text>

  <!-- Arrow scale indicators on bars -->
  <line x1="240" y1="932" x2="440" y2="932" stroke="#888780" stroke-width="0.5"/>
  <text x="240" y="943" font-size="10" fill="#888780" text-anchor="middle">0</text>
  <text x="299" y="943" font-size="10" fill="#888780" text-anchor="middle">40</text>
  <text x="440" y="943" font-size="10" fill="#888780" text-anchor="middle">170 g CO₂</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- BOTTOM FOOTER -->
  <!-- ══════════════════════════════════════════════ -->
  <rect x="0" y="978" width="900" height="102" fill="#1D9E75"/>
  <text x="450" y="1010" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">¿Cuál es la mejor eleccion para tu ciudad?</text>
  <text x="450" y="1033" text-anchor="middle" font-size="12" fill="#9FE1CB">Prioriza bicicleta · metro · bus eléctrico · caminar</text>
  <text x="450" y="1055" text-anchor="middle" font-size="11" fill="#5DCAA5">Fuentes: IPCC (2022) · IEA (2023) · Our World in Data · Agencia Europea de Medio Ambiente</text>
  <text x="450" y="1072" text-anchor="middle" font-size="10" fill="#1D9E75" opacity="0">.</text>

  <!-- Left legend icons strip -->
  <rect x="30" y="980" width="18" height="18" rx="4" fill="#27500A"/>
  <rect x="55" y="980" width="18" height="18" rx="4" fill="#3C3489"/>
  <rect x="80" y="980" width="18" height="18" rx="4" fill="#0C447C"/>
  <rect x="105" y="980" width="18" height="18" rx="4" fill="#633806"/>
  <rect x="130" y="980" width="18" height="18" rx="4" fill="#791F1F"/>
  <text x="30" y="1012" font-size="9" fill="#9FE1CB">Bici</text>
  <text x="55" y="1012" font-size="9" fill="#9FE1CB">Metro</text>
  <text x="80" y="1012" font-size="9" fill="#9FE1CB">Bus</text>
  <text x="105" y="1012" font-size="9" fill="#9FE1CB">Auto E.</text>
  <text x="130" y="1012" font-size="9" fill="#9FE1CB">Gasolina</text>
</svg>
